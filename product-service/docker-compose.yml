
version: '4'
services:
  mongodb:
    image: mongo:7.0.5
    container_name: orderBridge-product-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootroot
      MONGO_INITDB_DATABASE: product-service-mongodb
    volumes:
      - ./data:/data/db